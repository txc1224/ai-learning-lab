services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-learning-lab-postgres
    environment:
      POSTGRES_DB: ai_learning_lab
      POSTGRES_USER: ai_learning_lab
      POSTGRES_PASSWORD: ai_learning_lab
    ports:
      - "5433:5432"
    volumes:
      - ai_learning_lab_postgres_data:/var/lib/postgresql/data
      - ./lessons/03-postgres-persistence/examples/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_learning_lab -d ai_learning_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ai_learning_lab_postgres_data:
